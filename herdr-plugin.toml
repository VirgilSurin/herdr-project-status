id = "project-status"
name = "Project Status"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "A project bar showing the focused pane's AWS profile (with session time left) and the env vars its project.config asks for."
platforms = ["linux", "macos"]

# The status itself comes from the shell hook (shell/hook.zsh): env vars only
# exist inside each shell, so the shell writes them to a per-pane state file on
# every prompt, which the project bar renders. The events below run one
# idempotent reconcile that drops state for panes that no longer exist and,
# when sidebar tokens are enabled (PS_SIDEBAR), re-reports each workspace from
# the pane you are actually looking at.

# Once per server start / live handoff: metadata does not survive a restart,
# but the state files do.
[[startup]]
command = ["bash", "project-status.sh", "reconcile"]

[[events]]
on = "pane.focused"
command = ["bash", "project-status.sh", "reconcile"]

[[events]]
on = "tab.focused"
command = ["bash", "project-status.sh", "reconcile"]

[[events]]
on = "pane.closed"
command = ["bash", "project-status.sh", "reconcile"]

[[events]]
on = "pane.exited"
command = ["bash", "project-status.sh", "reconcile"]

# The project bar: a few live rows at the bottom of the tab that follow the
# focused pane. Toggle per tab.
[[actions]]
id = "bar"
title = "Project Status: toggle bar"
contexts = ["global"]
command = ["bash", "project-status.sh", "bar"]

# Full, untruncated values for the focused pane.
[[actions]]
id = "show"
title = "Project Status: details"
contexts = ["global"]
command = ["bash", "project-status.sh", "show"]

# Checks the install (hook sourced, sidebar rows, starship) and prints any
# missing snippet.
[[actions]]
id = "doctor"
title = "Project Status: doctor"
contexts = ["global"]
command = ["bash", "project-status.sh", "doctor"]

[[panes]]
id = "bar"
title = "Project"
placement = "split"
platforms = ["linux", "macos"]
command = ["zsh", "-f", "bar.zsh"]

[[panes]]
id = "details"
title = "Project Status"
placement = "overlay"
platforms = ["linux", "macos"]
command = ["bash", "project-status.sh", "details-ui"]

[[panes]]
id = "doctor"
title = "Project Status: doctor"
placement = "overlay"
platforms = ["linux", "macos"]
command = ["bash", "project-status.sh", "doctor-ui"]
