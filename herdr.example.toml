# For ~/.config/herdr/config.toml (then: herdr server reload-config).

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "project-status.bar"
description = "project status: toggle bar"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "project-status.show"
description = "project status: details"

